<VirtualHost *:443>
    ServerName bugtalk.gaboff.dev.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bugtalk.gaboff.dev.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bugtalk.gaboff.dev.br/privkey.pem

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
    </Directory>
</VirtualHost>
